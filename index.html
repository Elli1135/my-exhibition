<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>アートクリエイター・児童文化部 個展会場</title>
  <style>
    body { 
      margin: 0; padding: 0; 
      background: radial-gradient(circle at 50% 50%, #4a0e17 0%, #290a0f 50%, #1a0b0d 100%); 
      color: #d4af37; font-family: 'Times New Roman', '游明朝', serif; 
      overflow: hidden; height: 100vh;
    }

    #door-overlay { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      z-index: 9999; display: flex; transition: opacity 2.0s ease-in-out; 
      background-color: #1a0b0d; 
    }
    .door { 
      width: 50%; height: 100%; 
      background: linear-gradient(to right, #4a0e17, #290a0f); 
      border-left: 2px solid #d4af37; border-right: 2px solid #d4af37; 
      transition: transform 3.0s cubic-bezier(0.65, 0, 0.35, 1); 
    }
    #door-overlay.open .door-left { transform: translateX(-100%); }
    #door-overlay.open .door-right { transform: translateX(100%); }
    
    /* さらにパネルを大きく、威圧感を出す */
    #door-panel { 
      position: absolute; top: 50%; left: 50%; 
      transform: translate(-50%, -50%); 
      z-index: 10000; text-align: center; 
      width: 450px; padding: 60px; 
      background: rgba(0, 0, 0, 0.6); 
      border: 4px double #d4af37;
      box-shadow: 0 0 50px rgba(0,0,0,0.9);
    }
    
    /* 入力欄をさらに強調 */
    #pass-input { 
      width: 100%; padding: 25px; margin-bottom: 30px; 
      background: #1a0b0d; border: 2px solid #d4af37; 
      color: #d4af37; font-size: 1.8rem; text-align: center; 
      box-sizing: border-box; letter-spacing: 3px;
    }
    
    /* ボタンを極大化 */
    #enter-btn { 
      width: 100%; padding: 25px; background: #290a0f; 
      border: 3px solid #d4af37; color: #d4af37; 
      font-size: 2.0rem; font-weight: bold; cursor: pointer; 
      margin-bottom: 30px; transition: all 0.4s ease;
    }
    #enter-btn:hover { background: #d4af37; color: #1a0b0d; transform: scale(1.05); }
    
    /* BGM操作ボタン */
    #bgm-toggle { 
      width: 100%; padding: 20px; background: #4a0e17; 
      border: 2px solid #d4af37; color: #d4af37; 
      cursor: pointer; font-size: 1.4rem; transition: 0.3s;
    }
    #bgm-toggle:hover { background: #d4af37; color: #1a0b0d; }
  </style>
</head>
<body>

  <audio id="bgm" src="bgm.mp3" loop></audio>

  <div id="door-overlay">
    <div class="door door-left"></div>
    <div id="door-panel">
      <input type="password" id="pass-input" placeholder="Password">
      <button id="enter-btn">OPEN</button>
      <button id="bgm-toggle" onclick="toggleBGM()">BGM: <span id="bgm-status">OFF</span></button>
    </div>
    <div class="door door-right"></div>
  </div>

  <script>
    const overlay = document.getElementById('door-overlay');
    const bgm = document.getElementById('bgm');
    const bgmStatus = document.getElementById('bgm-status');
    let bgmEnabled = false;

    function toggleBGM() {
      bgmEnabled = !bgmEnabled;
      bgmStatus.innerText = bgmEnabled ? "ON" : "OFF";
    }

    document.getElementById('enter-btn').addEventListener('click', () => {
      if (document.getElementById('pass-input').value === "1234") {
        if (bgmEnabled) { bgm.play().catch(e => console.log("BGM restricted")); }
        overlay.classList.add('open');
      } else {
        alert('パスワードが違います');
      }
    });
  </script>
</body>
</html>
