<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>限定画像ビューア - 大合同個展</title>
    <style>
        /* 🎨 全体のデザイン */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, #7a1f29 0%, #4a0e17 50%, #290a0f 100%);
            overflow: hidden; font-family: 'Times New Roman', serif;
        }
        /* パスワード画面のデザイン */
        #password-area {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; color: white; text-align: center;
        }
        #pass-input { padding: 10px; border-radius: 5px; border: none; margin: 10px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="password-area">
        <h3>部員専用ページです。パスワードを入力してください。</h3>
        <input type="password" id="pass-input">
        <button onclick="checkPassword()">入室する</button>
    </div>

    <div id="main-content" style="display:none;">
        <h1>個展会場へようこそ！</h1>
        </div>

    <script>
        function checkPassword() {
            // ★ここを実際のパスワードに変更してください
            const correctPass = "Art_Creator"; 
            
            if (document.getElementById('pass-input').value === correctPass) {
                document.getElementById('password-area').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                alert('パスワードが違います！');
            }
        }
    </script>
</body>
</html>
