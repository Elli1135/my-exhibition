<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>アートクリエイター・児童文化部 個展</title>
  <style>
    body { margin: 0; background: #290a0f; color: #d4af37; font-family: serif; overflow: hidden; }
    /* 扉のデザイン */
    #door-overlay { position: fixed; top:0; left:0; width: 100%; height: 100%; z-index: 999; display: flex; align-items: center; justify-content: center; background: #1a0b0d; transition: opacity 1.2s; }
    .door { width: 50%; height: 100%; background: #4a0e17; border: 2px solid #d4af37; transition: transform 1s; }
    .door-left { transform: translateX(0); }
    .door-right { transform: translateX(0); }
    #door-overlay.open .door-left { transform: translateX(-100%); }
    #door-overlay.open .door-right { transform: translateX(100%); }
    
    /* ギャラリーのデザイン */
    #gallery-body { display: none; padding: 20px; text-align: center; }
    .author-row { margin: 10px auto; padding: 10px; width: 300px; border: 1px solid #d4af37; display: flex; justify-content: space-between; align-items: center; }
    .author-btn { cursor: pointer; background: none; border: none; color: #d4af37; font-size: 1.2rem; }
    
    #bgm-toggle { position: fixed; top: 10px; right: 10px; cursor: pointer; z-index: 2000; }
  </style>
</head>
<body>

  <button id="bgm-toggle" onclick="toggleBGM()">BGM ON/OFF</button>
  <audio id="bgm" loop><source src="bgm.mp3" type="audio/mpeg"></audio>

  <div id="door-overlay">
    <div class="door door-left"></div>
    <div style="position:absolute; z-index:1000; text-align:center;">
      <input type="password" id="pass-input" placeholder="パスワード">
      <button id="enter-btn">OPEN</button>
    </div>
    <div class="door door-right"></div>
  </div>

  <div id="gallery-body">
    <h1>館内案内</h1>
    <div class="button-list">
      <div class="author-row"><button class="author-btn" onclick="alert('画像を表示します')">ルーム 1</button><span>待ちなし</span></div>
      </div>
  </div>

  <script>
    const overlay = document.getElementById('door-overlay');
    const gallery = document.getElementById('gallery-body');
    const bgm = document.getElementById('bgm');

    document.getElementById('enter-btn').addEventListener('click', () => {
      if (document.getElementById('pass-input').value === "1234") {
        overlay.classList.add('open');
        setTimeout(() => { 
          overlay.style.display = 'none'; 
          gallery.style.display = 'block'; 
        }, 1200);
      } else { alert('パスワードが違います'); }
    });

    function toggleBGM() { bgm.paused ? bgm.play() : bgm.pause(); }
  </script>
</body>
</html>
