<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アートクリエイター・児童文化部へようこそ！</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #290a0f; color: white; font-family: serif; overflow: hidden; }
    #door-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #290a0f; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1.2s; }
    #gallery-body { display: none; width: 100%; height: 100%; padding: 20px; box-sizing: border-box; text-align: center; }
    #image-viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; }
    .auth-box { text-align: center; }
    #pass-input { padding: 10px; border-radius: 5px; border: none; }
    #enter-btn { padding: 10px 20px; cursor: pointer; background: #d4af37; border: none; border-radius: 5px; }
    .author-btn { display: block; margin: 10px auto; padding: 10px; width: 200px; background: #1a0b0d; border: 1px solid #d4af37; color: #d4af37; cursor: pointer; }
  </style>
</head>
<body>

  <div id="door-overlay">
    <div class="auth-box">
      <input type="password" id="pass-input" placeholder="パスワード">
      <button id="enter-btn">OPEN</button>
    </div>
  </div>

  <div id="gallery-body">
    <h2>館内案内</h2>
    <div class="button-list">
      <button class="author-btn" onclick="showImage('https://picsum.photos/id/10/400/400')">ルーム 1 を見る</button>
      <button class="author-btn" onclick="showImage('https://picsum.photos/id/12/400/400')">ルーム 2 を見る</button>
    </div>
  </div>

  <div id="image-viewer" onclick="this.style.display='none'">
    <img id="display-img" src="" style="max-width:90%; max-height:90%;">
  </div>

  <script>
    const overlay = document.getElementById('door-overlay');
    const gallery = document.getElementById('gallery-body');
    const viewer = document.getElementById('image-viewer');
    const displayImg = document.getElementById('display-img');

    // 扉を開く
    document.getElementById('enter-btn').addEventListener('click', () => {
      if (document.getElementById('pass-input').value === "1234") {
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.style.display = 'none'; gallery.style.display = 'block'; }, 1200);
      } else { alert('パスワードが違います！'); }
    });

    // 画像を表示する関数
    function showImage(url) {
      displayImg.src = url;
      viewer.style.display = 'flex';
    }
  </script>
</body>
</html>
