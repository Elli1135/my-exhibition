<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>アートクリエイター・児童文化部 個展</title>
  <style>
    body { margin: 0; background: #290a0f; color: #d4af37; font-family: 'Times New Roman', '游明朝', serif; overflow: hidden; }
    
    /* 扉の左右パネル */
    #door-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: flex; transition: opacity 1.5s ease; background-color: #1a0b0d; }
    .door { width: 50%; height: 100%; background: linear-gradient(to right, #4a0e17, #2b0409); border: 2px solid #d4af37; transition: transform 2.5s cubic-bezier(0.4, 0, 0.2, 1); }
    .door-left { transform: translateX(0); }
    .door-right { transform: translateX(0); }
    #door-overlay.open .door-left { transform: translateX(-100%); }
    #door-overlay.open .door-right { transform: translateX(100%); }
    
    /* パスワード入力とボタンの配置 */
    #door-panel { 
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      z-index: 10000; text-align: center; border: 3px double #d4af37; 
      padding: 50px; background: rgba(0,0,0,0.7); width: 300px;
    }
    #pass-input { 
      width: 100%; padding: 15px; margin-bottom: 20px; border: 2px solid #d4af37; 
      background: #1a0b0d; color: #d4af37; font-size: 1.5rem; text-align: center; box-sizing: border-box;
    }
    #enter-btn { 
      display: block; width: 100%; padding: 15px; cursor: pointer; 
      background: #d4af37; border: none; font-weight: bold; font-size: 1.2rem; color: #1a0b0d; margin-bottom: 20px;
    }
    /* BGMボタンをOPENの下へ移動 */
    #bgm-toggle { 
      width: 100%; padding: 10px; cursor: pointer; 
      background: #1a0b0d; border: 1px solid #d4af37; color: #d4af37; font-size: 1rem;
    }

    #gallery-body { display: none; padding: 40px; text-align: center; }
  </style>
</head>
<body>

  <audio id="bgm" src="bgm.mp3" loop></audio>

  <div id="door-overlay">
    <div class="door door-left"></div>
    <div id="door-panel">
      <input type="password" id="pass-input" placeholder="パスワード">
      <button id="enter-btn">OPEN</button>
      <button id="bgm-toggle" onclick="toggleBGM()">BGM: <span id="bgm-status">OFF</span></button>
    </div>
    <div class="door door-right"></div>
  </div>

  <div id="gallery-body">
    <h1>館内案内</h1>
    </div>

  <script>
    const overlay = document.getElementById('door-overlay');
    const gallery = document.getElementById('gallery-body');
    const bgm = document.getElementById('bgm');
    const bgmStatus = document.getElementById('bgm-status');
    let bgmEnabled = false;

    // BGMのON/OFF切り替え
    function toggleBGM() {
      bgmEnabled = !bgmEnabled;
      bgmStatus.innerText = bgmEnabled ? "ON" : "OFF";
    }

    // OPENボタン処理
    document.getElementById('enter-btn').addEventListener('click', () => {
      if (document.getElementById('pass-input').value === "1234") {
        // もしONなら音楽開始
        if (bgmEnabled) { bgm.play(); }
        
        overlay.classList.add('open');
        setTimeout(() => { 
          overlay.style.display = 'none'; 
          gallery.style.display = 'block'; 
        }, 2500);
      } else {
        alert('パスワードが違います');
      }
    });
  </script>
</body>
</html>
