<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>個展会場</title>
  <style>
    body { 
      margin: 0; padding: 0; 
      background: radial-gradient(circle at 50% 50%, #4a0e17 0%, #290a0f 50%, #1a0b0d 100%); 
      color: #d4af37; font-family: 'Times New Roman', serif; 
      overflow: hidden; height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }

    #door-overlay { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      z-index: 9999; display: flex; transition: opacity 2.0s ease-in-out; 
      background-color: #1a0b0d; 
    }
    .door { 
      width: 50%; height: 100%; 
      background: linear-gradient(to right, #4a0e17, #290a0f); 
      border-left: 2px solid #d4af37; border-right: 2px solid #d4af37; 
      transition: transform 3.0s cubic-bezier(0.65, 0, 0.35, 1); 
    }
    #door-overlay.open .door-left { transform: translateX(-100%); }
    #door-overlay.open .door-right { transform: translateX(100%); }
    
    /* 圧倒的なサイズ感への再調整 */
    #door-panel { 
      z-index: 10000; text-align: center; 
      width: 95%; /* 画面幅ギリギリまで広げる */
      max-width: 800px; /* 限界まで大きく */
      padding: 100px 60px; 
      background: rgba(0, 0, 0, 0.8); 
      border: 8px double #d4af37;
      box-shadow: 0 0 100px rgba(0,0,0,1);
    }
    
    /* BGM切替ボタン（2枚目の画像を再現：横並び） */
    .bgm-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; }
    .bgm-btn { 
      padding: 30px 40px; font-size: 2.0rem; cursor: pointer; 
      background: #290a0f; border: 3px solid #d4af37; color: #d4af37;
      font-weight: bold; width: 45%;
    }
    .bgm-btn.active { background: #d4af37; color: #1a0b0d; }

    /* OPENボタン */
    #enter-btn { 
      width: 100%; padding: 50px 0; background: #290a0f; 
      border: 4px solid #d4af37; color: #d4af37; 
      font-size: 4.0rem; font-weight: 900; cursor: pointer; 
      transition: 0.3s;
    }
    #enter-btn:hover { background: #d4af37; color: #1a0b0d; }
  </style>
</head>
<body>

  <audio id="bgm" src="bgm.mp3" loop></audio>

  <div id="door-overlay">
    <div class="door door-left"></div>
    <div id="door-panel">
      <div class="bgm-container">
        <button id="bgm-on" class="bgm-btn" onclick="setBGM(true)">BGM ON</button>
        <button id="bgm-mute" class="bgm-btn" onclick="setBGM(false)">MUTE</button>
      </div>
      <button id="enter-btn">OPEN</button>
    </div>
    <div class="door door-right"></div>
  </div>

  <script>
    const overlay = document.getElementById('door-overlay');
    const bgm = document.getElementById('bgm');
    let bgmEnabled = false;

    function setBGM(enabled) {
      bgmEnabled = enabled;
      document.getElementById('bgm-on').className = enabled ? 'bgm-btn active' : 'bgm-btn';
      document.getElementById('bgm-mute').className = !enabled ? 'bgm-btn active' : 'bgm-btn';
    }

    document.getElementById('enter-btn').addEventListener('click', () => {
      if (bgmEnabled) { bgm.play().catch(e => console.log(e)); }
      overlay.classList.add('open');
    });

    // 初期状態
    setBGM(false);
  </script>
</body>
</html>
