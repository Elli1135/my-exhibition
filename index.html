<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アートクリエイター・児童文化部 個展</title>
  <style>
    body { margin: 0; background: #290a0f; color: #d4af37; font-family: 'Times New Roman', serif; overflow-x: hidden; }
    
    /* 美術館の扉 */
    #door-overlay { position: fixed; top:0; left:0; width: 100%; height: 100%; z-index: 999; display: flex; transition: opacity 1.2s; background: #1a0b0d; }
    .door { width: 50%; height: 100%; background: #4a0e17; border: 2px solid #d4af37; transition: transform 2.0s cubic-bezier(0.4, 0, 0.2, 1); }
    #door-overlay.open .door-left { transform: translateX(-100%); }
    #door-overlay.open .door-right { transform: translateX(100%); }
    
    /* 扉のパネル（中央にパスワードと操作ボタン） */
    #door-panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; text-align: center; width: 80%; max-width: 350px; }
    #pass-input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #d4af37; background: #1a0b0d; color: #d4af37; text-align: center; }
    #enter-btn { width: 100%; padding: 15px; background: #d4af37; border: none; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
    .bgm-btns { display: flex; gap: 10px; justify-content: center; }
    .bgm-btn { flex: 1; padding: 10px; background: #4a0e17; border: 1px solid #d4af37; color: #d4af37; cursor: pointer; }
    .bgm-btn.active { background: #d4af37; color: #1a0b0d; }

    /* ギャラリー内部（1〜10のリスト） */
    #gallery-body { display: none; padding: 40px 20px; text-align: center; }
    .room-list { display: flex; flex-direction: column; gap: 15px; align-items: center; }
    .room-row { width: 100%; max-width: 400px; padding: 15px; border: 1px solid #d4af37; display: flex; justify-content: space-between; align-items: center; }
    .room-btn { cursor: pointer; background: #d4af37; border: none; padding: 10px 20px; color: #1a0b0d; font-weight: bold; }
  </style>
</head>
<body>

  <audio id="bgm" src="bgm.mp3" loop></audio>

  <div id="door-overlay">
    <div class="door door-left"></div>
    <div id="door-panel">
      <input type="password" id="pass-input" placeholder="PASSWORD">
      <button id="enter-btn">OPEN</button>
      <div class="bgm-btns">
        <button id="bgm-on" class="bgm-btn" onclick="setBGM(true)">BGM ON</button>
        <button id="bgm-mute" class="bgm-btn active" onclick="setBGM(false)">MUTE</button>
      </div>
    </div>
    <div class="door door-right"></div>
  </div>

  <div id="gallery-body">
    <h1>児童文化部 個展会場</h1>
    <div class="room-list" id="room-list">
      </div>
  </div>

  <script>
    const overlay = document.getElementById('door-overlay');
    const gallery = document.getElementById('gallery-body');
    const bgm = document.getElementById('bgm');
    let bgmEnabled = false;

    // ルームリスト生成
    const roomList = document.getElementById('room-list');
    for(let i=1; i<=10; i++) {
      const row = document.createElement('div');
      row.className = 'room-row';
      row.innerHTML = `<span>ルーム ${i}</span><button class="room-btn" onclick="alert('ルーム${i}の作品へ')">Enter</button>`;
      roomList.appendChild(row);
    }

    function setBGM(enabled) {
      bgmEnabled = enabled;
      document.getElementById('bgm-on').className = enabled ? 'bgm-btn active' : 'bgm-btn';
      document.getElementById('bgm-mute').className = !enabled ? 'bgm-btn active' : 'bgm-btn';
    }

    document.getElementById('enter-btn').addEventListener('click', () => {
      if (document.getElementById('pass-input').value === "1234") {
        if (bgmEnabled) { bgm.play().catch(e => console.log(e)); }
        overlay.classList.add('open');
        setTimeout(() => { gallery.style.display = 'block'; }, 1000);
      } else { alert('パスワードが違います'); }
    });
  </script>
</body>
</html>
