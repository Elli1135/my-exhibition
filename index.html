<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アートクリエイター・児童文化部 個展</title>
  <style>
    body { margin: 0; background: #1a0b0d; color: #d4af37; font-family: 'Times New Roman', serif; }
    
    /* 扉エリア */
    #door-overlay { position: fixed; top:0; left:0; width: 100%; height: 100%; z-index: 999; display: flex; transition: opacity 1.5s; background: #1a0b0d; }
    .door { width: 50%; height: 100%; background: linear-gradient(to right, #4a0e17, #290a0f); border: 1px solid #d4af37; transition: transform 2.5s cubic-bezier(0.4, 0, 0.2, 1); }
    #door-overlay.open .door-left { transform: translateX(-100%); }
    #door-overlay.open .door-right { transform: translateX(100%); }
    
    #ui-panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 400px; text-align: center; }
    input, button { width: 100%; padding: 15px; margin: 10px 0; background: #290a0f; border: 1px solid #d4af37; color: #d4af37; font-size: 1.2rem; cursor: pointer; }
    
    /* ギャラリー内部 */
    #gallery { display: none; padding: 20px; text-align: center; }
    .author-card { border: 1px solid #d4af37; margin: 20px auto; padding: 20px; width: 90%; max-width: 500px; }
    .slider { position: relative; margin: 10px 0; }
    .slider img { width: 100%; height: auto; display: none; border: 1px solid #d4af37; }
    .slider img.active { display: block; }
    .nav-btn { position: absolute; top: 50%; background: rgba(0,0,0,0.5); border: none; color: #d4af37; padding: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <audio id="bgm" src="bgm.mp3" loop></audio>

  <div id="door-overlay">
    <div class="door door-left"></div>
    <div id="ui-panel">
      <input type="password" id="pass" placeholder="PASSWORD">
      <button onclick="enter()">OPEN</button>
      <div style="display:flex; gap:10px;">
        <button id="btn-on" onclick="setBGM(true)">BGM ON</button>
        <button id="btn-off" onclick="setBGM(false)">MUTE</button>
      </div>
    </div>
    <div class="door door-right"></div>
  </div>

  <div id="gallery">
    <h1>展覧会会場</h1>
    <div id="author-list"></div>
  </div>

  <script>
    let bgmEnabled = false;
    const bgm = document.getElementById('bgm');
    const authors = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j'];
    
    // aさんは4枚、他は1枚のデータ構造
    const works = {
      'a': ['img1.jpg', 'img2.jpg', 'img3.jpg', 'img4.jpg'],
      'b': ['img1.jpg'], 'c': ['img1.jpg'], 'd': ['img1.jpg'], 'e': ['img1.jpg'],
      'f': ['img1.jpg'], 'g': ['img1.jpg'], 'h': ['img1.jpg'], 'i': ['img1.jpg'], 'j': ['img1.jpg']
    };

    function setBGM(state) {
      bgmEnabled = state;
      document.getElementById('btn-on').style.background = state ? '#d4af37' : '#290a0f';
      document.getElementById('btn-off').style.background = !state ? '#d4af37' : '#290a0f';
    }

    function enter() {
      if (document.getElementById('pass').value === "1234") {
        if (bgmEnabled) bgm.play();
        document.getElementById('door-overlay').classList.add('open');
        setTimeout(() => { document.getElementById('gallery').style.display = 'block'; }, 1000);
      }
    }

    const list = document.getElementById('author-list');
    authors.forEach(name => {
      let div = document.createElement('div');
      div.className = 'author-card';
      div.innerHTML = `<h3>${name}さんの作品</h3>
        <div class="slider" id="slider-${name}">
          ${works[name].map((img, i) => `<img src="${img}" class="${i===0?'active':''}">`).join('')}
          ${works[name].length > 1 ? `<button class="nav-btn" style="left:0" onclick="move('${name}', -1)">◀</button><button class="nav-btn" style="right:0" onclick="move('${name}', 1)">▶</button>` : ''}
          <p>1 / ${works[name].length}</p>
        </div>`;
      list.appendChild(div);
    });

    function move(name, dir) { /* スライダー制御ロジックはここに追加 */ }
  </script>
</script>
</body>
</html>
