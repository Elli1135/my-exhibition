<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>アートクリエイター・児童文化部 個展会場</title>
  <style>
    /* ページ全体：重厚な色調を維持 */
    body { margin: 0; padding: 0; background-color: #290a0f; color: #d4af37; font-family: 'Times New Roman', '游明朝', serif; overflow: hidden; }
    
    /* 扉の左右パネル：アニメーションを重視して長く記述 */
    #door-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: flex; transition: opacity 1.5s ease; background-color: #1a0b0d; }
    .door { width: 50%; height: 100%; background: linear-gradient(to right, #4a0e17, #2b0409); border: 2px solid #d4af37; transition: transform 2.5s cubic-bezier(0.4, 0, 0.2, 1); }
    .door-left { transform: translateX(0); }
    .door-right { transform: translateX(0); }
    #door-overlay.open .door-left { transform: translateX(-100%); }
    #door-overlay.open .door-right { transform: translateX(100%); }
    
    /* 扉の中のパスワードエリア */
    #door-panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10000; text-align: center; border: 3px double #d4af37; padding: 40px; background: rgba(0,0,0,0.6); }
    #pass-input { padding: 15px; border: 1px solid #d4af37; background: #1a0b0d; color: #d4af37; font-size: 1.2rem; }
    #enter-btn { padding: 15px 30px; cursor: pointer; background: #d4af37; border: none; font-weight: bold; font-size: 1.2rem; }

    /* ギャラリー案内エリア：情報量を多く保持 */
    #gallery-body { display: none; width: 100%; height: 100vh; padding: 40px; box-sizing: border-box; text-align: center; overflow-y: auto; }
    .container { max-width: 800px; margin: 0 auto; }
    .button-list { display: flex; flex-direction: column; gap: 20px; align-items: center; margin-top: 30px; }
    .author-row { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 500px; padding: 20px; border: 1px solid #d4af37; background: rgba(212, 175, 55, 0.05); }
    .author-btn { background: none; border: 1px solid #d4af37; color: #d4af37; padding: 10px 20px; cursor: pointer; font-size: 1rem; transition: 0.5s; }
    
    /* BGM操作 */
    #bgm-toggle { position: fixed; top: 30px; right: 30px; cursor: pointer; z-index: 20000; background: #d4af37; border: none; padding: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <button id="bgm-toggle" onclick="toggleBGM()">BGM ON/OFF</button>
  <audio id="bgm" src="bgm.mp3" loop></audio>

  <div id="door-overlay">
    <div class="door door-left"></div>
    <div id="door-panel">
      <input type="password" id="pass-input" placeholder="パスワードを入力">
      <button id="enter-btn">OPEN</button>
    </div>
    <div class="door door-right"></div>
  </div>

  <div id="gallery-body">
    <div class="container">
      <h1>館内案内</h1>
      <div class="button-list">
        <div class="author-row"><button class="author-btn" onclick="openRoom('1')">ルーム 1</button><span>待ちなし</span></div>
        <div class="author-row"><button class="author-btn" onclick="openRoom('2')">ルーム 2</button><span>15分待ち</span></div>
        <div class="author-row"><button class="author-btn" onclick="openRoom('3')">ルーム 3</button><span>40分待ち</span></div>
        <div class="author-row"><button class="author-btn" onclick="openRoom('4')">ルーム 4</button><span>即行ける！</span></div>
        <div class="author-row"><button class="author-btn" onclick="openRoom('5')">ルーム 5</button><span>即行ける！</span></div>
      </div>
    </div>
  </div>

  <script>
    const overlay = document.getElementById('door-overlay');
    const gallery = document.getElementById('gallery-body');
    const bgm = document.getElementById('bgm');

    // パスワード処理
    document.getElementById('enter-btn').addEventListener('click', () => {
      const pass = document.getElementById('pass-input').value;
      if (pass === "1234") {
        overlay.classList.add('open');
        setTimeout(() => { 
          overlay.style.display = 'none'; 
          gallery.style.display = 'block'; 
        }, 2500); // 扉の動きに合わせ、あえて時間を長く設定
      } else {
        alert('パスワードが異なります。');
      }
    });

    // BGM制御
    function toggleBGM() {
      if (bgm.paused) { bgm.play(); } else { bgm.pause(); }
    }

    // 部屋を開く機能
    function openRoom(roomId) {
      alert('ルーム ' + roomId + ' へ移動します。');
    }
  </script>
</body>
</html>
